# ClusterIP: the frontend is exposed externally through the Ingress
# (http://node-react.local), not through a NodePort.
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
