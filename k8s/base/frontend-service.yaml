# NodePort: the frontend is reachable from outside the cluster on port
# 30080 of every node (kind maps it to localhost:30080). Its nginx proxies
# /api to backend-service, so the backend itself stays internal.
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
