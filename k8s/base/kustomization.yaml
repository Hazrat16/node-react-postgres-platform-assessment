# Environment-agnostic base. Overlays (k8s/overlays/<env>) add the namespace,
# the Postgres PV, the Ingress and secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: node-react-platform
    includeSelectors: false

resources:
  - app-configmap.yaml
  # backend
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-pdb.yaml
  # frontend
  - frontend-deployment.yaml
  - frontend-service.yaml
  # postgres primary + streaming read replica
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - postgres-pvc.yaml
  - postgres-replica-statefulset.yaml
  - postgres-read-service.yaml
  # platform services
  - redis-deployment.yaml
  - redis-service.yaml
  - bullmq-worker-deployment.yaml
  - search-deployment.yaml
  - search-service.yaml
  # isolation
  - networkpolicies.yaml

configMapGenerator:
  - name: postgres-scripts
    files:
      - postgres-scripts/primary-init.sh
      - postgres-scripts/replica-entrypoint.sh

# Image names are placeholders for locally built images; CI pins them per
# overlay to ghcr.io/...:<branch>-<sha> (see .github/workflows/ci-cd.yml).
images:
  - name: node-react-backend
    newTag: local
  - name: node-react-frontend
    newTag: local
