# OpenSearch, single node, dev mode (security plugin off). Safe only because
# it is reachable solely from the backend/worker (see networkpolicies.yaml).
# The index is derived data (rebuildable from Postgres), so an emptyDir is
# acceptable here; production would use a StatefulSet + PVC per node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  labels:
    app: search
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
        tier: data
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.6
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms512m -Xmx512m
            # Single-node dev: don't flip indices to read-only when the node's
            # disk is >95% full (production keeps the watermarks on).
            - name: cluster.routing.allocation.disk.threshold_enabled
              value: "false"
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 5
            failureThreshold: 36 # up to 3 minutes for the JVM to start
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
      volumes:
        - name: data
          emptyDir: {}
