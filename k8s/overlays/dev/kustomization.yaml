apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - namespace-dev.yaml
  - ../../base
  - postgres-pv.yaml

labels:
  - pairs:
      environment: dev
    includeSelectors: false

# Built from the git-ignored secrets.env. The generated name carries a
# content hash, so changing a secret automatically rolls the pods.
secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env
