# ingress-nginx tuned for kind: runs on the control-plane node (label
# ingress-ready=true) and binds host ports 80/443, which kind maps to the
# host machine. Also used by CI.
controller:
  hostPort:
    enabled: true
  service:
    type: NodePort
  nodeSelector:
    ingress-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1 # hostPort: old pod must go before the new one binds
  ingressClassResource:
    default: true
  config:
    # Rate-limited requests get 429 Too Many Requests instead of the default 503,
    # so clients (and dashboards) can tell throttling apart from outages.
    limit-req-status-code: "429"
    limit-conn-status-code: "429"
    # JSON access logs -> easy filtering in Loki (| json | status >= 500).
    log-format-escape-json: "true"
    log-format-upstream: '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host","method":"$request_method","path":"$uri","status":$status,"bytes":$bytes_sent,"request_time":$request_time,"upstream":"$proxy_upstream_name","upstream_status":"$upstream_status","request_id":"$req_id"}'
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false # switched on by Terraform once the CRD exists
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
